#
#
# ~chewygumxx/chezmoi-apply-xattr.git
# ::: :/.github/workflows/validate.yaml
#
#

name: Validate

on:
    push:
        branches:
            - main
        tags:
            - v*.*.*
    pull_request:

permissions:
    contents: read

env:
    METADATA_PATH: >-
        .repo-metadata.jsonc
    SHELLCHECK_FILES: >-
        chezmoi-apply-xattr
    RELEASE_ASSETS: |
        README.md
        LICENSE
        chezmoi-apply-xattr

jobs:
    # Installs this repository's packages and runs its own commitlint, so
    # the rules are @chewygumxx/commitlint-config's, as the commit-msg hook
    # applies them.
    commitlint:
        name: Lint Commit Messages
        if: >-
            github.event_name == 'push' ||
            github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: read
        uses: chewygumxx/.github/.github/workflows/commitlint.yaml@v1


    update-headers:
        name:    Update Header Metdata
        runs-on: ubuntu-latest
        if: >-  
            github.event_name == 'push'   && 
            github.ref_type   == 'branch'
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Update tracked files
              uses: chewygumxx/sync-header-metadata@v2
              with:
                  mode: update

    repo-metadata:
        name:    Sync Repository Metadata
        runs-on: ubuntu-latest
        if: >-  
            github.event_name == 'push'   && 
            github.ref_type   == 'branch' &&
            github.ref_name   == 'main'

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Check for Metadata Changes
              id:   check-modified
              uses: dorny/paths-filter@v4
              with:
                  base: ${{ github.ref }}
                  filters: |
                      metadata:
                          - ${{ env.METADATA_PATH }}

            - name: Mint App Installation Token
              if:   steps.check-modified.outputs.metadata == 'true'
              id:   mint-token
              uses: actions/create-github-app-token@v3
              with:
                  # `client-id` is the correct key, actionlint falsely corrects this to `app-id`
                  client-id:   ${{    vars.METADATA_APP_CLIENT_ID   }}
                  private-key: ${{ secrets.METADATA_APP_PRIVATE_KEY }}
                  permission-administration: write

            - name: Apply Metadata
              if:   steps.check-modified.outputs.metadata == 'true'
              uses: chewygumxx/sync-repo-metadata@v2
              with:
                  metadata_path: ${{ env.METADATA_PATH }}
                  token: ${{ steps.mint-token.outputs.token }}

    shellcheck:
        name:    Shellcheck Linting
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Shellcheck
              uses: ludeeus/action-shellcheck@2.0.0
              with:
                  additional_files: ${{ env.SHELLCHECK_FILES }}

    release:
        name:        Release
        runs-on:     ubuntu-latest
        environment: release
        permissions:
            contents: write
        needs:
            - commitlint
            - update-headers
            - shellcheck
        if: >-
            always() &&
            github.ref_type == 'tag' &&
            (needs.commitlint.result     == 'success' || needs.commitlint.result     == 'skipped') &&
            (needs.update-headers.result == 'success' || needs.update-headers.result == 'skipped') &&
            needs.shellcheck.result == 'success'

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Create Archive
              run: |
                  # shellcheck disable=SC2086
                  tar -czf "chezmoi-apply-xattr-${{ github.ref_name }}.tar.gz" $RELEASE_ASSETS

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  files: chezmoi-apply-xattr-${{ github.ref_name }}.tar.gz
